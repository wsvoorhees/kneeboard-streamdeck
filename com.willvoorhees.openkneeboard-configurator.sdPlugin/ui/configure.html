<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenKneeboard Configurator</title>
  <style>
    :root { color-scheme: dark; font: 13px system-ui, sans-serif; }
    body { margin: 0; padding: 16px; color: #f0f0f0; background: #252525; }
    h1 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
    label { display: block; margin: 12px 0; color: #d3d3d3; }
    input, select, textarea { display: block; box-sizing: border-box; width: 100%; margin-top: 5px; padding: 7px 8px; color: white; background: #363636; border: 1px solid #555; border-radius: 4px; font: inherit; }
    input[type=checkbox] { display: inline; width: auto; margin: 0 7px 0 0; }
    textarea { min-height: 70px; resize: vertical; font-family: ui-monospace, monospace; }
    button { padding: 7px 16px; color: white; background: #266773; border: 0; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    small { display: block; margin-top: 3px; color: #a9a9a9; line-height: 1.35; }
    #status { min-height: 18px; margin-top: 10px; color: #c7dfdf; }
    .page-section { margin: 18px 0 12px; padding-top: 12px; border-top: 1px solid #555; }
    .page-section h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #a9a9a9; }
    #generated { margin: 14px 0; }
  </style>
</head>
<body>
  <h1 id="heading">OpenKneeboard Configurator</h1>
  <form id="form" hidden>
    <div id="fields"></div>
    <button id="save" type="submit">Save</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
  <script>
    // A spec's fifth element marks a PAGE setting: one that describes the Stream Deck page the key sits
    // on rather than the key, so it reads the same on every key of that page that holds it (pages.ts
    // PAGE_FIELDS). Those are grouped below a separator. They stay editable: the plugin is usable
    // without a profile generator, and a key made by hand has no other way to set them.
    const PAGE = { page: true };
    const specs = {
      'profile-select': [
        ['profile', 'OpenKneeboard profile', 'text', 'Exact name of an existing profile. Press a key or dial to switch.'],
      ],
      'tab-select': [
        ['tab', 'OpenKneeboard tab', 'text', 'Exact name of an existing tab. Press a key or dial to show it.'],
        ['view', 'View', 'number', '0 or blank uses the active view; 1 and above select a specific view.'],
      ],
      'placement-dial': [
        ['axis', 'Axis', 'axis', 'Choose a direction or Size. Device default follows the dial column, or Left/Right on a key.'],
        ['direction', 'Key press ticks', 'number', 'Use 1 for increase or -1 for decrease. Default: 1; 0 disables key nudging.'],
        ['tickMultiplier', 'Dial ticks per detent', 'number', '1 for fine; 10 for coarse position/rotation; 5 for coarse size.'],
        ['sizes', 'View sizes (JSON)', 'json', 'Optional mapping of view numbers to {"Width":0.15,"Height":0.25}.'],
        ['placementTab', 'View 1 tab', 'text', 'The placement reference view 1 shows on this page: Placement or Placement Fine.', PAGE],
      ],
      'view-select': [['view', 'View', 'number', '1-based OpenKneeboard view number.']],
      'view-visibility': [
        ['view', 'View', 'number', '1-based OpenKneeboard view number.'],
        ['tab', 'Tab', 'text', 'Exact tab title to put on the view first; leave blank to keep what it shows.'],
        ['pageTab', 'View 1 tab', 'text', 'The tab view 1 shows when this page comes up: the deck map, or Placement / Placement Fine on a placement page. Blank: leave view 1 alone.', PAGE],
        ['kneeboardProfile', 'OpenKneeboard profile', 'text', 'Exact OpenKneeboard profile name to switch to. Blank: keep the current profile.', PAGE],
      ],
      'view-opacity': [
        ['view', 'View', 'number', 'Leave blank to follow the selected placement view.'],
        ['step', 'Key press step', 'number', 'Signed opacity change; negative fades out. Default: -0.1.'],
      ],
      'placement-reset': [],
      'recentre': [],
    };
    const form = document.getElementById('form');
    const fields = document.getElementById('fields');
    const status = document.getElementById('status');
    let socket;
    let context;
    let action;
    let suffix;
    let settings = {};
    let activeSpecs = [];
    const axes = [
      ['', 'Device default'],
      ['0', 'Left/Right'],
      ['1', 'Up/Down'],
      ['2', 'Near/Far'],
      ['3', 'Pitch'],
      ['4', 'Yaw'],
      ['5', 'Roll'],
      ['size', 'Size'],
    ];
    function selectedAxis(settings) {
      if (settings.size === true) return 'size';
      return Number.isInteger(settings.dialIndex) && settings.dialIndex >= 0 && settings.dialIndex <= 5
        ? String(settings.dialIndex) : '';
    }
    function writeAxisSelection(next, choice) {
      delete next.dialIndex;
      delete next.size;
      if (choice === 'size') next.size = true;
      else if (choice !== '') next.dialIndex = Number(choice);
    }
    function render() {
      fields.replaceChildren();
      let pageSection = false;
      for (const [key, labelText, kind, hint, flags] of activeSpecs) {
        if (flags?.page === true && !pageSection) {
          pageSection = true;
          const section = document.createElement('div');
          section.className = 'page-section';
          const title = document.createElement('h2');
          title.textContent = 'This page';
          const note = document.createElement('small');
          note.textContent = 'Shared by every key on this page that has it, Show View keys and placement dials alike: saving here updates the others on screen. If the keys disagree, they show an alert and nothing switches.';
          section.append(title, note);
          fields.append(section);
        }
        const label = document.createElement('label');
        label.textContent = labelText;
        const input = document.createElement(kind === 'json' ? 'textarea' : kind === 'axis' ? 'select' : 'input');
        input.id = key;
        if (kind !== 'json' && kind !== 'axis') input.type = kind;
        if (kind === 'number') input.step = 'any';
        if (kind === 'axis') {
          for (const [value, title] of axes) input.add(new Option(title, value));
          input.value = selectedAxis(settings);
        }
        if (kind === 'checkbox') input.checked = settings[key] === true;
        else if (kind === 'json') input.value = settings[key] ? JSON.stringify(settings[key], null, 2) : '';
        else if (kind !== 'axis') input.value = settings[key] ?? '';
        label.append(input);
        const help = document.createElement('small');
        help.textContent = hint;
        label.append(help);
        fields.append(label);
      }
      // A profile generator stamps `generatedBy` on the keys it writes (plugin/src/identity.ts
      // GENERATED_BY); the panel only reports it. A key made by hand has none and shows nothing.
      if (typeof settings.generatedBy === 'string' && settings.generatedBy && activeSpecs.length > 0) {
        const generated = document.createElement('small');
        generated.id = 'generated';
        generated.textContent = `Generated by ${settings.generatedBy}; its next profile install replaces changes made here.`;
        fields.append(generated);
      }
      if (activeSpecs.length === 0) {
        const note = document.createElement('p');
        note.textContent = 'This action has no settings.';
        fields.append(note);
        document.getElementById('save').hidden = true;
      }
      form.hidden = false;
    }
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const next = { ...settings };
      try {
        for (const [key, , kind] of activeSpecs) {
          const input = document.getElementById(key);
          if (kind === 'axis') {
            writeAxisSelection(next, input.value);
            continue;
          }
          if (kind === 'checkbox') { next[key] = input.checked; continue; }
          if (input.value.trim() === '') { delete next[key]; continue; }
          if (kind === 'number') {
            const value = Number(input.value);
            if (!Number.isFinite(value)) throw new Error(`${key} must be a finite number`);
            if (key === 'view' && (!Number.isInteger(value) || value < (suffix === 'tab-select' && key === 'view' ? 0 : 1) || value > 255)) {
              throw new Error(`${key} must be a valid view number`);
            }
            next[key] = value;
          } else if (kind === 'json') {
            const value = JSON.parse(input.value);
            if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error(`${key} must be an object`);
            next[key] = value;
          } else next[key] = input.value.trim();
        }
        if (suffix === 'profile-select' && !next.profile) throw new Error('Enter an OpenKneeboard profile name');
        if (suffix === 'tab-select' && !next.tab) throw new Error('Enter an OpenKneeboard tab name');
        socket.send(JSON.stringify({ event: 'setSettings', action, context, payload: next }));
        settings = next;
        status.textContent = 'Saved';
      } catch (error) { status.textContent = error.message; }
    });
    window.connectElgatoStreamDeckSocket = (port, uuid, event, info, actionInfo) => {
      context = uuid;
      const details = JSON.parse(actionInfo);
      action = details.action;
      settings = details.payload?.settings ?? {};
      suffix = action.split('.').at(-1);
      activeSpecs = specs[suffix] ?? [];
      // The heading uses the action's name in the manifest where it differs from its UUID suffix:
      // Show View kept the view-visibility UUID so keys already placed still resolve to it.
      const names = { 'view-visibility': 'show view' };
      document.getElementById('heading').textContent = `OpenKneeboard · ${names[suffix] ?? suffix.replaceAll('-', ' ')}`;
      render();
      socket = new WebSocket(`ws://127.0.0.1:${port}`);
      socket.addEventListener('open', () => socket.send(JSON.stringify({ event, uuid })));
      socket.addEventListener('message', ({ data }) => {
        const message = JSON.parse(data);
        if (message.event === 'didReceiveSettings' && message.payload?.settings) {
          settings = message.payload.settings;
          render();
        }
      });
    };
  </script>
</body>
</html>
